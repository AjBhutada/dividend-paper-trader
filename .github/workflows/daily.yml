name: daily-paper-trading
# 9 pm India time, after NSE publishes the day's files. Marks positions at the official close, refreshes the dividend list,
# rebuilds the dashboard (GitHub Pages: docs/), and on the last trading day of the week opens an issue (= email) with the weekly report.
# Anything the live trader did not handle today is traded here on 1-minute candles, and a day a skipped run left out is caught up.
# Any problem opens a GitHub issue that mentions the owner (= an email).
on:
  schedule:
    - cron: "30 15 * * 1-5"        # 9:00 pm India
    - cron: "0 18 * * 1-5"         # 11:30 pm India: spare start in case GitHub skips the first (does nothing if the day is done)
  workflow_dispatch:
    inputs:
      date:
        description: "Trading date to process (YYYY-MM-DD). Leave blank for today in India."
        required: false
permissions:
  contents: write
  issues: write
concurrency:
  group: paper-trading
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore downloaded NSE data
        uses: actions/cache@v4
        with:
          path: .cache
          key: nse-data-${{ github.run_id }}
          restore-keys: nse-data-
      - run: pip install -q -r requirements.txt
      - name: Paper-trade the day
        run: python paper/engine.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - name: Keep the data cache small
        if: always()
        run: |
          find .cache/candles -type f -mtime +20 -delete 2>/dev/null || true
          find .cache/lists -type f -mtime +5 -delete 2>/dev/null || true
      - name: Failure email (GitHub issue)
        if: failure() && hashFiles('state/alerts_pending.md') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Paper bot: the 9 pm run failed ($(TZ=Asia/Kolkata date +'%d %b %H:%M'))" \
            --body "@AjBhutada the end-of-day run stopped with an error. The 11:30 pm spare run or tomorrow's run will catch the day up. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Problem email (GitHub issue)
        if: always() && hashFiles('state/alerts_pending.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "@AjBhutada the paper-trading bot needs a look:"; echo; cat state/alerts_pending.md; echo;
            echo "Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > "$RUNNER_TEMP/alert.md"
          gh issue create --title "Paper bot alert: $(TZ=Asia/Kolkata date +'%d %b %H:%M')" --body-file "$RUNNER_TEMP/alert.md"
          rm -f state/alerts_pending.md
      - name: Save results and the dashboard to the repo
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state README.md charts dashboard.html reports docs/data 2>/dev/null || git add -A
          git commit -q -m "Paper trading: $(TZ=Asia/Kolkata date +%F)" || echo "Nothing new to save"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 10; done
      - name: Weekly report email (GitHub issue)
        if: ${{ hashFiles('reports/weekly_pending.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Weekly paper-trading report: $(TZ=Asia/Kolkata date +'%d %b %Y')" --body-file reports/weekly_pending.md
          git rm -q reports/weekly_pending.md
          git commit -q -m "Weekly report sent"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 10; done
